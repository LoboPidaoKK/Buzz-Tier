name: Gerar ZIP e publicar Buzz-Tier

on:
  push:
    branches:
      - main
    paths:
      - "BuzzTier.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: buzztier-pages
  cancel-in-progress: true

jobs:
  build:
    name: Extrair BuzzTier.zip e preparar publicação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extrair ZIP e preparar site
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "BuzzTier.zip" ]; then
            echo "::error::Não encontrei BuzzTier.zip na raiz do repositório."
            exit 1
          fi

          unzip -t "BuzzTier.zip"
          rm -rf extracted _site dist
          mkdir -p extracted _site dist
          unzip -q "BuzzTier.zip" -d extracted

          INDEX_FILE="$(find extracted -type f -iname "index.html" -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo "::error::O arquivo index.html não foi encontrado dentro de BuzzTier.zip."
            echo "Confira se o ZIP contém os arquivos do site."
            exit 1
          fi

          SITE_DIR="${INDEX_FILE%/*}"
          cp -a "$SITE_DIR"/. _site/
          touch _site/.nojekyll

          if [ ! -f "_site/index.html" ]; then
            echo "::error::A extração não deixou index.html na raiz de publicação."
            exit 1
          fi

          cp "BuzzTier.zip" "dist/BuzzTier-v1.7.zip"

      - name: Enviar arquivos do site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: BuzzTier-v1.7-ZIP
          path: dist/BuzzTier-v1.7.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
